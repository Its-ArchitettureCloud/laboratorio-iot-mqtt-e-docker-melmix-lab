services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: mqtt-broker
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto:/mosquitto/config
      - mosquitto_data:/mosquitto/data
    command: >
      sh -c "rm -f /mosquitto/config/passwordfile
      && mosquitto_passwd -b -c /mosquitto/config/passwordfile melissio mqtt123
      && chmod 0700 /mosquitto/config/passwordfile
      && mosquitto -c /mosquitto/config/mosquitto.conf"

  sensor_1:
    build: ./sensor
    container_name: sensor-01
    environment:
      MQTT_BROKER: mosquitto
      MQTT_PORT: 1883
      MQTT_USERNAME: melissio
      MQTT_PASSWORD: mqtt123
      SENSOR_ID: sensor01
      MQTT_TOPIC: iot/aula/sensor01/temperatura
      SEND_INTERVAL: 5
    depends_on:
      - mosquitto


  mailhog:
    image: mailhog/mailhog:latest
    container_name: mailhog
    ports:
      - "1025:1025"
      - "8025:8025"

  influxdb:
    image: influxdb:2.7
    container_name: influxdb
    ports:
      - "8086:8086"
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: melissio
      DOCKER_INFLUXDB_INIT_PASSWORD: influx12345
      DOCKER_INFLUXDB_INIT_ORG: its
      DOCKER_INFLUXDB_INIT_BUCKET: iot
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: its-iot-token
    volumes:
      - influxdb_data:/var/lib/influxdb2

volumes:
  mosquitto_data:
  influxdb_data:
